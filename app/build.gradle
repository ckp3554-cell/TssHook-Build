plugins { id 'com.android.application' }

android {
    namespace 'com.example.tsshook'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.tsshook"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -fno-exceptions -fno-rtti' }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildFeatures { buildConfig true }

    packagingOptions {
        jniLibs { useLegacyPackaging = true }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
